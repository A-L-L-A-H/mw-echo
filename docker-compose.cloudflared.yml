services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mw-echo-cloudflared
    restart: unless-stopped
    command: ${CLOUDFLARE_TUNNEL_TOKEN:+tunnel --no-autoupdate run --token }${CLOUDFLARE_TUNNEL_TOKEN:-tunnel --no-autoupdate --url http://mw-echo:4310}
    depends_on:
      mw-echo:
        condition: service_healthy
